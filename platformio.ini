; PlatformIO Project Configuration File
;
; https://docs.platformio.org/page/projectconf.html
;
; src/ 안의 .cpp는 기본적으로 전부 함께 컴파일된다. main.cpp와 main_adaptive.cpp는
; 각각 setup()/loop()를 갖고 있어 충돌하므로, env마다 하나만 남기고 걸러낸다.
;
; VSCode 툴바의 Upload 버튼은 env를 지정하지 않으므로 default_envs에 적힌 것만 올라간다.
; 다른 버전을 올리려면 아래 default_envs를 바꾸거나, 터미널에서 -e로 직접 지정한다.
;
;   pio run -t upload -e uno            ; 고정 경계값 버전 (main.cpp)
;   pio run -t upload -e uno_adaptive   ; 적응형 경계값 버전 (main_adaptive.cpp)
;   pio run -t upload -e uno_motortest  ; 모터 배선 진단 (motor_test.cpp)
;   pio run -t upload -e uno_yohan      ; 선요한 버전 (sunyohan.cpp)
;
; 주의: Upload 버튼은 "열어둔 파일"이 아니라 default_envs의 env를 올린다.

[platformio]
default_envs = uno_yohan

[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200

[env:uno]
build_src_filter = +<*> -<main_adaptive.cpp> -<motor_test.cpp> -<sunyohan.cpp> -<sunyohan copy.cpp>

[env:uno_adaptive]
build_src_filter = +<*> -<main.cpp> -<motor_test.cpp> -<sunyohan.cpp> -<sunyohan copy.cpp>

[env:uno_motortest]
build_src_filter = +<*> -<main.cpp> -<main_adaptive.cpp> -<sunyohan.cpp> -<sunyohan copy.cpp>

[env:uno_yohan]
; 빼기 대신 더하기로 지정한다. src/에 사본("sunyohan copy.cpp" 등)이 생겨도 안 딸려온다.
build_src_filter = -<*> +<sunyohan.cpp>
